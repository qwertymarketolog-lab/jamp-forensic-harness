name: Harness CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile harness
        run: python -m py_compile s1_execution.py

      - name: Verify candidate n3 extraction
        run: |
          python - <<'PY'
          import s1_execution

          candidate = {
              "execution_status": "OK",
              "result": {
                  "exp31": {"status": "VALID"},
                  "n1": {"status": "PASS"},
                  "n2": {"status": "PASS"},
                  "n3": {
                      "terminal_status": "TERMINAL_HALT",
                      "halt_reasons": [
                          {"stage": "N2", "diagnostic_code": "DUPLICATE_SOURCE_REF"}
                      ],
                  },
              },
          }
          oracle = {
              "terminal_status": "TERMINAL_HALT",
              "halt_reasons": [
                  {"stage": "N2", "diagnostic_code": "DUPLICATE_SOURCE_REF"}
              ],
          }
          result = s1_execution.differential(
              candidate,
              oracle,
              seed=42069,
              vector=1,
              original={"control": True},
              mutated={"control": False},
              fingerprint="test-fingerprint",
          )
          assert result["execution_status"] == "OK"
          assert result["divergence_classification"] == "MATCH"
          assert result["ordered_halt_reasons"] == oracle["halt_reasons"]
          print("candidate result.n3 extraction: PASS")
          PY
      - name: Checkout pinned JAMP candidate
        uses: actions/checkout@v4
        with:
          repository: qwertymarketolog-lab/JAMP
          ref: 0b0f15d4615cb129382c25af8859d450ac1193ff
          path: jamp-mirror
          fetch-depth: 1

      - name: Verify pinned candidate and Frozen Core
        run: |
          test "$(git -C jamp-mirror rev-parse HEAD)" = "0b0f15d4615cb129382c25af8859d450ac1193ff"
          test "$(git -C jamp-mirror rev-parse HEAD:src/jamp/run.py)" = "0fee0e1c5c1a1548361965ac51eacdeba62bfe8a"
          echo "candidate_sha=$(git -C jamp-mirror rev-parse HEAD)"
          echo "frozen_core_blob=$(git -C jamp-mirror rev-parse HEAD:src/jamp/run.py)"

      - name: Execute S1-r3
        id: s1
        continue-on-error: true
        run: |
          python s1_execution.py --jamp-mirror "$GITHUB_WORKSPACE/jamp-mirror" | tee s1-r3-summary.json

      - name: Publish S1-r3 ledger
        uses: actions/upload-artifact@v4
        with:
          name: s1-r3-ledger
          path: artifacts/s1-r3.ndjson
          if-no-files-found: error

      - name: Publish S1-r3 summary
        uses: actions/upload-artifact@v4
        with:
          name: s1-r3-summary
          path: s1-r3-summary.json
          if-no-files-found: error
